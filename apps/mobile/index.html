<!doctype html>
<!--
  `data-accent`, `data-theme`, and `data-theme-pref` carry placeholders
  that the postbuild replaces, once per (accent × theme-pref) pair,
  producing one shell variant per member of `uiAccentValues` ×
  `uiThemeValues`. The `/m` route handler then picks a variant by
  reading the user's `ws_ui` cookie.

  This is codegen from compile-time enums, NOT per-request string
  substitution into HTML — that would be constructing server-rendered
  HTML from request-derived data, which CLAUDE.md §3 prohibits. It also
  can't be done with an inline script: the `/m` CSP is `script-src 'self'`
  with no 'unsafe-inline'. And it can't be done from the app bundle,
  because module scripts are deferred and first paint would flash the
  default theme/accent.

  `data-theme` is the *resolved* theme (mirrors `resolveSsrTheme`:
  system stamps dark); `data-theme-pref` is the raw preference. For
  `system`, the `prefers-color-scheme` media blocks in the token
  stylesheets correct the first paint on a light-OS device with zero JS
  — including offline, where the pinned canonical shell may carry any
  stamped pref.
-->
<html
  lang="en"
  data-theme="__WS_THEME__"
  data-theme-pref="__WS_THEME_PREF__"
  data-accent="__WS_ACCENT__"
>
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve
         to real values on a notched device; without it the tab bar and
         bottom sheet sit under the home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <!-- Status-bar color, themed at stamp time: an explicit pref stamps
         the same value into both metas; `system` stamps light/dark so
         the OS picks. Post-load, ui-prefs.ts collapses these to a
         single meta tracking the live `--bg`. The hexes are the two
         `--bg` values from packages/shared/styles/color-tokens.css. -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="__WS_TC_LIGHT__"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="__WS_TC_DARK__"
    />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="manifest" href="/m/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/brand/pwa-icon-180.png" />
    <!-- iOS home-screen name + status-bar treatment for the installed
         app. Modern iOS reads display/standalone from the manifest;
         these two fill the gaps it still takes from meta tags. No
         apple-touch-startup-image matrix — a per-device splash set is
         a deliberate Phase 3 skip (recorded in the build plan). -->
    <meta name="apple-mobile-web-app-title" content="Weavestream" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Weavestream</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
