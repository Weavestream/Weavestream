# ─────────────────────────────────────────────────────────────────────────
# Weavestream — MinIO console overlay
#
# The default compose.yml deliberately does NOT publish the MinIO admin
# console. Layer this file on top when you need temporary access from
# the deploy host:
#
#   docker compose -f compose.yml -f compose.console.yml up -d
#
# Then open http://127.0.0.1:9101 in a browser running on the same host
# (or via an SSH tunnel from your workstation:
#   ssh -L 9101:127.0.0.1:9101 operator@deploy-host).
#
# Set MINIO_CONSOLE_HOST_BIND=0.0.0.0 to expose the console on the LAN
# instead. Strongly discouraged for internet-facing installs — the
# console authenticates with MINIO_ACCESS_KEY/MINIO_SECRET_KEY which
# also grant programmatic root on every bucket.
# ─────────────────────────────────────────────────────────────────────────

services:
  minio:
    ports:
      - "${MINIO_HOST_BIND:-127.0.0.1}:${MINIO_HOST_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_HOST_BIND:-127.0.0.1}:${MINIO_CONSOLE_HOST_PORT:-9101}:9001"
