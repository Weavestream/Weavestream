version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      # Prisma CLI + client must be on the same major — grouping them
      # prevents dependabot from opening a PR that bumps one and leaves
      # the other pinned on the old major (incompatible ABI).
      prisma:
        patterns:
          - "prisma"
          - "@prisma/client"
      nest:
        patterns:
          - "@nestjs/*"
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
      tiptap:
        patterns:
          - "@tiptap/*"
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      zxcvbn:
        patterns:
          - "@zxcvbn-ts/*"
      types:
        patterns:
          - "@types/*"
    # Major-version bumps on these packages are always planned upgrade
    # projects, not drive-by PRs. Ignore them at the dependabot level
    # and re-enable (by removing the entry) when we're ready to take
    # the upgrade on intentionally. Patch + minor updates still flow.
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      # Blocked by tooling, not by us: typescript-eslint supports TS < 6.1
      # and ts-jest TS < 7. Remove when both support TypeScript 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Blocked by tooling: eslint-plugin-react (via eslint-config-next) and
      # eslint-plugin-jsx-a11y stop at ESLint 9. Remove when they support 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # BullMQ 6 needs a 2-release rollout: legacy repeatables are swept on
      # v5 first (the release after 1.10.0), then v6. Remove for release 2.
      - dependency-name: "bullmq"
        update-types: ["version-update:semver-major"]
      # Node types must match the runtime major (Node 24 in Docker and CI),
      # or code can use APIs production does not have. Remove together with
      # the docker "node" ignore below when the runtime moves to Node 26.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
    # Base images are pinned by version tag and digest, so this ecosystem
    # proposes patch/minor and digest bumps. When it bumps the Node patch,
    # bump NODE_VERSION in .github/workflows/ci.yml in the same PR.
    # Majors stay a planned upgrade: Node 26 becomes LTS on 2026-10-28.
    # Remove this ignore (and the @types/node one above) for that move.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "docker"
