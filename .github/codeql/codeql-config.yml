name: WeaveStream CodeQL config

# Use the security-extended pack so we keep the alerts default setup
# would have given us (CWE-89, CWE-79, CWE-22, etc.) and only narrow
# the specific false-positive below.
queries:
  - uses: security-extended

# Per-query path filtering for confirmed false positives.
#
# `js/insufficient-password-hash` — CWE-916 — flags any flow from a
# password-shaped source into SHA-1/MD5/etc. The HIBP Pwned Passwords
# *range* API is a public k-anonymity protocol that mandates uppercase
# hex SHA-1 of the plaintext: only the first 5 hex chars (20 bits) are
# sent off-host, and the digest is never persisted (stored credentials
# use AES-GCM envelope encryption — see PasswordsService.encrypt). The
# protocol cannot be satisfied with bcrypt/argon2/scrypt.
#
# Reference: https://haveibeenpwned.com/API/v3#PwnedPasswords
query-filters:
  - exclude:
      id: js/insufficient-password-hash
      paths:
        - apps/api/src/passwords/hibp-range-hash.ts

  # `js/file-access-to-http` — CWE-200 — flags file contents reaching an
  # outbound request, as a possible exfiltration backdoor. Both scripts
  # read the checked-in Mermaid corpus and pass each diagram's source to
  # a browser over the DevTools protocol, which is the only way to render
  # it: Mermaid measures text with getBBox, so it cannot run under jest.
  #
  # The query's premise does not hold here. The "remote URL" is the
  # DevTools endpoint of a Chromium *this script just spawned* with
  # `--remote-debugging-port=0`, which binds loopback — verified to be
  # `ws://127.0.0.1:<ephemeral>/devtools/browser/<uuid>`, never a
  # configurable or attacker-influenced address. The "file data" is the
  # corpus fixtures and Mermaid's own installed `dist/` bundle: repo test
  # data, no secrets, no PII, no untrusted input anywhere in either
  # script. Both are maintenance/CI tooling and ship in no bundle.
  #
  # Excluded rather than refactored because sending the diagram source to
  # the browser IS the design — there is no variant of these scripts that
  # renders Mermaid without it. Scoped to the two files by path, so the
  # rule keeps its teeth everywhere else.
  - exclude:
      id: js/file-access-to-http
      paths:
        - apps/web/scripts/mermaid-corpus.mjs
        - apps/web/scripts/check-diagram-csp.mjs
