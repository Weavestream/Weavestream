name: Breeze contract check

# Early warning: fails when the newest Breeze RMM release changes a partner
# API endpoint, field, or schemaVersion that the Weavestream Breeze driver
# reads, so the driver can be updated before customers upgrade Breeze.
#
# Needs no secrets and no running Breeze. The Breeze source is fetched as
# text (a sparse checkout of the partner API folder) and is never built,
# installed, or run. See apps/api/scripts/check-breeze-contract.ts.

on:
  schedule:
    # Mondays 06:17 UTC.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      breeze_ref:
        description: "Breeze tag to check (empty = latest release)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: breeze-contract
  cancel-in-progress: true

env:
  PNPM_VERSION: 11.9.0
  NODE_VERSION: "24.22.1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The check is compiled with full type checking, and the driver types
      # reach the Prisma client and the shared packages (no database needed).
      - run: pnpm --filter @weavestream/db prisma:generate
      - run: pnpm --filter @weavestream/shared build
      - run: pnpm --filter @weavestream/db build

      - name: Pick the Breeze release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.breeze_ref }}
        run: |
          ref="${REQUESTED_REF:-}"
          if [ -z "$ref" ]; then
            ref="$(gh api repos/lanternops/breeze/releases/latest --jq .tag_name)"
          fi
          # A tag name only: it is passed to git and printed in the summary.
          if ! printf '%s' "$ref" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'; then
            echo "Not a plain Breeze tag name: $ref" >&2
            exit 2
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Fetch the Breeze partner API source (read only)
        env:
          BREEZE_REF: ${{ steps.release.outputs.ref }}
        run: |
          dir="$RUNNER_TEMP/breeze"
          git clone --quiet --depth 1 --branch "$BREEZE_REF" --filter=blob:none --no-checkout \
            -c advice.detachedHead=false https://github.com/lanternops/breeze.git "$dir"
          git -C "$dir" sparse-checkout set --no-cone \
            /apps/api/src/routes/partnerApi/ /apps/api/src/services/versionInfo.ts
          git -C "$dir" -c advice.detachedHead=false checkout --quiet

      - name: Compare with what Weavestream reads
        working-directory: apps/api
        env:
          BREEZE_REF: ${{ steps.release.outputs.ref }}
        run: |
          pnpm exec tsc -p scripts/tsconfig.check-breeze-contract.json
          node node_modules/.cache/breeze-contract-check/scripts/check-breeze-contract.js \
            "$RUNNER_TEMP/breeze" --ref "$BREEZE_REF" --summary "$GITHUB_STEP_SUMMARY"
