packages:
  - "apps/*"
  - "packages/*"

confirmModulesPurge: false

overrides:
  multer: 2.2.0
  # `next` pins postcss to an exact 8.4.31, which carries
  # GHSA-6g55-p6wh-862q (arbitrary file read) and GHSA-r28c-9q8g-f849
  # (path traversal), both via sourceMappingURL auto-loading in CSS
  # comments. The pin means no lockfile refresh can move it — an
  # override is the only lever. Drop this entry once next's own pin
  # reaches >=8.5.18. Pinned exactly, like multer above, so the resolver
  # cannot drift onto a release too new to have cleared pnpm's
  # minimum-release-age supply-chain gate.
  postcss: 8.5.19
  # postcss 8.5.19 depends on nanoid ^3.3.12 and the lockfile settled on
  # 3.3.16, which carries GHSA-2v37-7h3g-55p8 (a custom `size: 0` generator
  # loops forever). The range does admit the fix, so this is not a pin the
  # resolver needs — it is a scope limiter: `pnpm update nanoid -r` reaches
  # the same nanoid but also bumps 16 unrelated packages (@babel/*,
  # @codemirror/*, browserslist chain, acorn, ws), which is a far wider
  # supply-chain delta than one advisory warrants. The override moves
  # nanoid and nothing else. Drop this entry once postcss's own floor
  # reaches >=3.3.18. Pinned exactly, for the same reason as above.
  nanoid: 3.3.18
  # next carries its own optional sharp (^0.34.5) for next/image
  # optimization, which this app does not use — every image is a plain
  # <img> served through the API. That copy still trips the libvips
  # advisories (CVE-2026-33327/33328/35590/35591), so it is forced onto
  # the same 0.35.x the API depends on. Deliberately outside next's
  # declared range: it dedupes two full sharp+libvips binary sets down
  # to one, and the next/image path that would exercise it is unused.
  sharp: 0.35.3
  # Two React apps (`apps/web` on Next, `apps/mobile` on Vite) declaring
  # independent ranges let pnpm resolve two copies of the React types.
  # TypeScript treats those as *unrelated* nominal types, so a `Ref`
  # produced under one is not assignable to a `Ref` expected by the
  # other — the failure surfaces as "Two different types with this name
  # exist" in files that touch neither app's boundary, and as
  # "cannot be named without a reference to .pnpm/@types+react@..."
  # during `next build`. Forcing one copy is the only fix that holds as
  # both apps' ranges drift; bump both together.
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3

supportedArchitectures:
  os:
    - linux
    - darwin
    - win32
  cpu:
    - x64
    - arm64
  libc:
    - musl
    - glibc

allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  argon2: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true
