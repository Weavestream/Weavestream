packages:
  - "apps/*"
  - "packages/*"

confirmModulesPurge: false

overrides:
  # @nestjs/platform-express pins multer to an exact 2.2.0, which carries
  # GHSA-wc9g-mqfw-jrwm and GHSA-535w-7cp7-47q4 (DoS via crafted multipart
  # field names / oversized array index) plus GHSA-qfvm-cv95-jqjf, an
  # advisory filed against 2.2.0 alone with no listed patched version. The
  # exact pin means no lockfile refresh can move it — an override is the
  # only lever. 2.3.0 clears all three. Pinned exactly so the resolver
  # cannot drift onto a release too new to have cleared pnpm's
  # minimum-release-age supply-chain gate.
  multer: 2.3.0
  # next pins postcss to an exact version, so no lockfile refresh can
  # move it — an override is the only lever. The original reason was
  # GHSA-6g55-p6wh-862q (arbitrary file read) and GHSA-r28c-9q8g-f849
  # (path traversal) in next's old 8.4.31 pin; next 16.3.4 pins 8.5.23,
  # which clears both, so the entry is no longer a security force. It
  # stays as a dedupe pin, set to next's own 8.5.23: without it, apps/web
  # keeps a stale 8.5.19 for autoprefixer while apps/mobile and tailwind
  # resolve 8.5.28, and the workspace carries three copies of postcss.
  # Pinned exactly, and to what next declares, so the resolver cannot
  # drift onto a release too new to have cleared pnpm's
  # minimum-release-age supply-chain gate.
  postcss: 8.5.23
  # postcss 8.5.23 declares nanoid ^3.3.16, and the resolver settles on
  # 3.3.16, which carries GHSA-2v37-7h3g-55p8 (a custom `size: 0`
  # generator loops forever). The range does admit the fix, so this is
  # not a pin the resolver needs — it is a scope limiter: `pnpm update
  # nanoid -r` reaches the same nanoid but also bumps 16 unrelated
  # packages (@babel/*, @codemirror/*, browserslist chain, acorn, ws),
  # which is a far wider supply-chain delta than one advisory warrants.
  # The override moves nanoid and nothing else. Drop this entry once the
  # postcss pinned above floors nanoid at >=3.3.18 (postcss 8.5.28 does).
  # Pinned exactly, for the same reason as multer above.
  nanoid: 3.3.18
  # next carries its own optional sharp for next/image optimization,
  # which this app does not use — every image is a plain <img> served
  # through the API. sharp <0.35.4 trips the libheif advisories bundled
  # as GHSA-rgj7-g3m4-5g8c, so every copy is forced onto the 0.35.4 the
  # API and worker depend on. next 16.3.4 declares ^0.35.4 itself, so
  # this is now a dedupe pin rather than an out-of-range force: it
  # collapses two full sharp+libvips binary sets down to one.
  sharp: 0.35.4
  # Two React apps (`apps/web` on Next, `apps/mobile` on Vite) declaring
  # independent ranges let pnpm resolve two copies of the React types.
  # TypeScript treats those as *unrelated* nominal types, so a `Ref`
  # produced under one is not assignable to a `Ref` expected by the
  # other — the failure surfaces as "Two different types with this name
  # exist" in files that touch neither app's boundary, and as
  # "cannot be named without a reference to .pnpm/@types+react@..."
  # during `next build`. Forcing one copy is the only fix that holds as
  # both apps' ranges drift; bump both together.
  "@types/react": 19.2.17
  "@types/react-dom": 19.2.3

supportedArchitectures:
  os:
    - linux
    - darwin
    - win32
  cpu:
    - x64
    - arm64
  libc:
    - musl
    - glibc

allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  argon2: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true
