# ─────────────────────────────────────────────────────────────────────────
# Weavestream — end-user compose file
#
# This file pulls published images from GitHub Container Registry. You
# don't need the source tree to run Weavestream; the three commands below
# are enough:
#
#   curl -O https://raw.githubusercontent.com/Weavestream/Weavestream/main/compose.yml
#   curl -O https://raw.githubusercontent.com/Weavestream/Weavestream/main/.env.example
#   mv .env.example .env
#   # edit .env — fill in passwords/keys (see scripts/keygen.sh / keygen.ps1)
#   docker compose up -d
#
# Pin a specific release by exporting WEAVESTREAM_VERSION=1.0.0 (or adding
# it to .env). Leave unset to track :latest.
#
# Contributors building from source should layer in compose.build.yml:
#   docker compose -f compose.yml -f compose.build.yml up -d --build
#
# The compose *project name* defaults to the parent folder (so
# `/volume1/docker/weavestream-prod` → project `weavestream-prod`).
# Keep each Weavestream instance in its own folder, or override with
# COMPOSE_PROJECT_NAME= in .env (or -p on the CLI) if you need two
# instances side by side under the same folder name.
# ─────────────────────────────────────────────────────────────────────────

networks:
  weavestream-net:
    driver: bridge

# Persistent data lives in real host folders (bind mounts) rather than
# named Docker volumes, so you can `ls`, snapshot, rsync, and back up
# with normal filesystem tools. Override DATA_DIR in .env to point at
# any absolute path (e.g. /volume1/docker/weavestream on a NAS).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [weavestream-net]
    # Block in-container privilege escalation (setuid/setgid binaries can
    # no longer gain new capabilities). Safe across all images we ship:
    # nothing in the runtime path relies on post-exec privilege gain.
    security_opt:
      - no-new-privileges:true
    # Postgres stays on the internal compose network only. Contributors
    # running `pnpm dev` on the host get a 5434 host mapping via
    # compose.build.yml. Operators who need ad-hoc shell access should
    # use `docker compose exec postgres psql ...` rather than re-publishing
    # the port to the host.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [weavestream-net]
    security_opt:
      - no-new-privileges:true
    # Redis is internal-only by default. Same rationale as postgres:
    # contributors get a 6381 host mapping in compose.build.yml; operators
    # use `docker compose exec redis redis-cli ...` for inspection.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    image: ghcr.io/weavestream/weavestream-api:${WEAVESTREAM_VERSION:-latest}
    restart: unless-stopped
    networks: [weavestream-net]
    security_opt:
      - no-new-privileges:true
    env_file: .env
    # Inside the compose network the api reaches postgres/redis by service
    # name. Uploaded files live on a host-bound directory shared with
    # the worker container; both write atomically via tmp+rename.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      FILE_STORAGE_DIR: /var/lib/weavestream/files
      BACKUP_STORAGE_DIR: /var/lib/weavestream/backup
    volumes:
      - ${DATA_DIR:-./data}/files:/var/lib/weavestream/files
      # Scheduled Postgres exports land here. Mounted read-only on the
      # api so the admin Backups download endpoint can stream completed
      # dumps back to the browser without giving the api process write
      # access to the directory. The worker mounts the same path
      # read-write (see below) and is the only writer.
      - ${DATA_DIR:-./data}/backup:/var/lib/weavestream/backup:ro
    # `prisma migrate deploy` is idempotent and protected by a Postgres
    # advisory lock, so running it on every api start is safe and lets
    # us avoid a short-lived one-shot `migrate` container (which some
    # Docker UIs — UGREEN, Portainer, Docker Desktop — flag as a
    # project-level error even when it exits 0 on purpose).
    command:
      - "sh"
      - "-c"
      - "cd /app/packages/db && ./node_modules/.bin/prisma migrate deploy && cd /app/apps/api && exec node dist/main.js"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # start_period covers worst-case migration time on a slow NAS
      # before the healthcheck starts counting failures.
      start_period: 120s

  worker:
    image: ghcr.io/weavestream/weavestream-worker:${WEAVESTREAM_VERSION:-latest}
    restart: unless-stopped
    networks: [weavestream-net]
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      FILE_STORAGE_DIR: /var/lib/weavestream/files
      BACKUP_STORAGE_DIR: /var/lib/weavestream/backup
    volumes:
      - ${DATA_DIR:-./data}/files:/var/lib/weavestream/files
      # Worker is the sole writer for scheduled Postgres exports. The
      # api mounts the same host path read-only so admins can download
      # completed dumps via the Backups page. Operators MUST include
      # both `${DATA_DIR}/backup` and `${DATA_DIR}/files` in their
      # external backup routine — the runbook calls this out.
      - ${DATA_DIR:-./data}/backup:/var/lib/weavestream/backup
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      # Liveness only — the worker has no HTTP listener; BullMQ queue
      # health is probed from the api side (/health/queues).
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: ghcr.io/weavestream/weavestream-web:${WEAVESTREAM_VERSION:-latest}
    restart: unless-stopped
    networks: [weavestream-net]
    security_opt:
      - no-new-privileges:true
    env_file: .env
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    # Publishes the Next.js UI on the host. By default this binds every
    # host interface (0.0.0.0), so the port is reachable from anywhere
    # that can route to this host.
    #
    # Direct exposure of this port is for LOCAL / LAN use only. For any
    # internet-facing deployment, run a trusted TLS reverse proxy (Caddy,
    # Nginx, Traefik, …) in front of `web` and keep TRUST_PROXY_HOPS=1.
    # Without a trusted proxy a client can forge X-Forwarded-For and poison
    # audit IPs, per-IP lockout / rate-limit buckets, and IP allow/deny
    # rules. See docs/deployment/tls.
    #
    # If your reverse proxy runs on this same host, bind the port to
    # loopback so it is never directly reachable from the network — replace
    # the mapping below with:
    #   - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
